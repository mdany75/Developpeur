  <header class="entete">
    <h1>Feuille de route de Développeur</h1>
    <p class="sous">Ce qui vient après la version 1.5, dans l'ordre où le faire. Mise à jour le 1<sup>er</sup> novembre 2026, d'après la nuit de travail sur la 1.5, la comparaison avec lightroom-mcp et la page <a href="https://claude.ai/artifact/9kQ7kKQk5VuXrrAWFrvVKS">Analyse du Développeur</a>. Chaque chantier est vérifié dans le code : ce qui existe déjà, ce qu'il faut construire, la taille et le risque.</p>
    <div class="encadre"><p><b>En résumé :</b> un petit correctif 1.5.1 pour trois défauts trouvés en chemin, puis les constats de Fibo 2 qui manquent, puis la 1.6 avec les garde-fous que l'Analyse jugeait les plus utiles. Le reste attend une vraie raison.</p></div>
  </header>

  <div class="etapes">

    <section class="etape">
      <div class="etape-tete"><h2>Livré dans la 1.5</h2><span class="quand">publiée le 1<sup>er</sup> novembre 2026 au matin (tag v1.5)</span></div>
      <div class="livre">
        <ul>
          <li><span class="coche">✓</span> <b>Retouche générative par Fibo 2</b>, en local (<code>generative_edit</code>, le 36<sup>e</sup> outil). Qualité équilibrée constatée : environ 5 minutes et 12 Go de mémoire pour une voiture changée de couleur.</li>
          <li><span class="coche">✓</span> <b>« Défais ça » retire la photo de Fibo 2</b> : <code>undo_last</code> défait les finitions, puis retire la nouvelle photo du catalogue et met son fichier à la Corbeille. Constaté dans Lightroom.</li>
          <li><span class="coche">✓</span> <b>Voir avant de copier</b> : <code>copy_settings</code> avec <code>plan</code> montre ce qui changerait sur chaque photo, sans rien écrire.</li>
          <li><span class="coche">✓</span> <b>Chercher par focale</b> dans <code>find_photos</code>.</li>
          <li><span class="coche">✓</span> <b>Avertissement de version</b> : <code>get_status</code> et <code>add_mask</code> le disent quand Lightroom n'est plus la 15.6, où les formes des masques ont été relevées.</li>
          <li><span class="coche">✓</span> <b>Une couleur par plage</b> : deux prélèvements dans une même plage font planter Lightroom 15.6 (constaté, catalogue sauvegardé avant). Une autre couleur passe par une seconde plage dans le même masque.</li>
          <li><span class="coche">✓</span> Les règles du projet rangées dans <code>docs/regles/</code>, vérifiées règle par règle, et les deux skills du projet entrés dans git.</li>
        </ul>
      </div>
    </section>

    <section class="etape">
      <div class="etape-tete"><span class="num">1</span><h2>Correctif 1.5.1 : trois défauts trouvés en chemin</h2><span class="quand">tout de suite</span></div>
      <div class="chantiers">
        <article class="chantier">
          <h3>Les consignes citent un paramètre qui n'existe pas</h3>
          <div class="marques"><span class="pastille petite">Petite</span><span class="pastille faible">Risque faible</span><span class="pastille interet">Intérêt 4/5</span></div>
          <p>Les consignes du connecteur disent « preview_settings, preview = true ». Or <code>preview_settings</code> n'a pas de paramètre <code>preview</code> : un Claude qui suit la consigne en mode « Proposer d'abord » se fait refuser l'appel. La page Analyse l'avait signalé le 27 octobre ; c'est toujours là.</p>
          <p class="deja">Travail : corriger la phrase de <code>ServerInfo.swift</code>, et un test qui vérifie que chaque paramètre cité dans les consignes existe dans l'outil nommé. Les consignes sont presque pleines : la phrase doit rester aussi courte.</p>
        </article>
        <article class="chantier">
          <h3>Fibo 2 : changer un objet entier avec un masque d'objet</h3>
          <div class="marques"><span class="pastille petite">Petite</span><span class="pastille moyen">Risque moyen</span><span class="pastille interet">Intérêt 4/5</span></div>
          <p>Cette nuit, la zone rectangulaire était plus étroite que la voiture : un bout est resté orange. <code>generative_edit</code> accepte déjà un masque de Lightroom comme zone, objet compris (<code>mask</code> avec <code>kind: object</code> et son cadre) : Lightroom trouve tout l'objet, et Fibo 2 change l'objet entier.</p>
          <p class="deja">Travail : un essai réel sur une copie d'Essais (même voiture, masque d'objet), puis une phrase dans la description de l'outil (« un objet : mask kind object plutôt que region »), qui est à sa limite de 1 200 caractères.</p>
        </article>
        <article class="chantier">
          <h3>Le titre de la fenêtre dans CLAUDE.md</h3>
          <div class="marques"><span class="pastille petite">Petite</span><span class="pastille faible">Risque faible</span><span class="pastille interet">Intérêt 2/5</span></div>
          <p><code>CLAUDE.md</code> dit que la barre de titre affiche « Développeur v1.4 ». Elle affiche le numéro installé (« Développeur v1.5 » ce matin) : la règle doit le dire sans numéro.</p>
          <p class="deja">Documentation seulement.</p>
        </article>
      </div>
    </section>
    <section class="etape">
      <div class="etape-tete"><span class="num">2</span><h2>Constats de Fibo 2 qui manquent</h2><span class="quand">à l'usage, sur des copies d'Essais</span></div>
      <div class="chantiers">
        <article class="chantier">
          <h3>La liste à éviter et le guidage</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille faible">Risque faible</span><span class="pastille interet">Intérêt 3/5</span></div>
          <p>Leur effet propre n'est pas encore mesuré. La seule façon de le juger : refaire la même modification à la même graine, en changeant un seul réglage, et comparer.</p>
          <p class="deja">Trois ou quatre essais en qualité équilibrée (5 minutes chacun), chaque constat dans <code>docs/SPEC.md</code> avec sa règle dans la simulation.</p>
        </article>
        <article class="chantier">
          <h3>Le seuil de la zone changée, sur d'autres photos</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille moyen">Risque moyen</span><span class="pastille interet">Intérêt 3/5</span></div>
          <p>Le seuil qui décide quelle zone revient dans la photo (0,10) n'a été vu que sur deux photos. Un fond changé par masque, un vêtement, une personne recopiée assez grande pour que Claude la signale : à voir chacun une fois.</p>
          <p class="deja">En même temps que les essais ci-dessus.</p>
        </article>
      </div>
    </section>
    <section class="etape">
      <div class="etape-tete"><span class="num">3</span><h2>Version 1.6 : les garde-fous de l'Analyse</h2><span class="quand">après le correctif</span></div>
      <div class="chantiers">
        <article class="chantier">
          <h3>Plafonds de dose et cumul des passes</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille moyen">Risque moyen</span><span class="pastille interet">Intérêt 4/5</span></div>
          <p>Rien n'empêche aujourd'hui Clarté, Correction du voile ou Texture de monter haut, ni plusieurs passes de s'empiler. Une table de doses par réglage (comme pour la peau) et un cumul par réglage, avec une alerte (Clarté au-delà de 25, Correction du voile au-delà de 20, Saturation ou Vibrance au-delà de 30), protégeraient le rendu naturel que tu veux.</p>
          <p class="deja">Signalé « fort » par la page Analyse. Au-delà du plafond : refus, sauf demande explicite de ta part.</p>
        </article>
        <article class="chantier">
          <h3>Progression et arrêt d'une commande longue</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille faible">Risque faible</span><span class="pastille interet">Intérêt 3/5</span></div>
          <p>Une commande seule (un rendu, une lecture) n'a ni barre de progression ni croix pour l'arrêter. Une barre « Claude : commande » dès 3 secondes, avec sa croix, te laisserait reprendre la main.</p>
          <p class="deja">Signalé « fort » par la page Analyse.</p>
        </article>
        <article class="chantier">
          <h3>Ne plus perdre une réponse</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille moyen">Risque moyen</span><span class="pastille interet">Intérêt 3/5</span></div>
          <p>Quand une réponse du module se perd (délai dépassé, liaison coupée), rien ne la garde. Le module garderait les 20 derniers résultats, et le connecteur pourrait les reprendre au lieu de tout recommencer.</p>
          <p class="deja">Signalé « fort » par la page Analyse.</p>
        </article>
      </div>
    </section>
    <section class="etape">
      <div class="etape-tete"><span class="num">4</span><h2>Plus tard</h2><span class="quand">quand une vraie raison se présente</span></div>
      <div class="chantiers">
        <article class="chantier">
          <h3>Relever les seuils provisoires</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille faible">Risque faible</span><span class="pastille interet">Intérêt 3/5</span></div>
          <p>Le bruit cherché à ISO 1 600 ou plus, la netteté et le bruit du bilan, les couleurs hors gamme, les points chauds, le contrôle des masques, les groupes de lumière. Réglés sur tes vraies photos Fujifilm, ils donneraient moins de fausses alertes et moins d'oublis.</p>
          <p class="deja">D'abord un relevé en lecture seule (<code>--constats</code>, <code>--eclairage</code>, les comptes du Suivi), puis un compte rendu, et seulement ensuite les changements.</p>
        </article>
        <article class="chantier">
          <h3>Ton style en chiffres</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille faible">Risque faible</span><span class="pastille interet">Intérêt 3/5</span></div>
          <p>Comment tu règles d'habitude tes photos de 4 ★ et plus, par appareil et selon l'ISO, proposé en quelques phrases pour ton guide de style. Ça complète <code>learn</code>, qui voit ce que tu corriges chez Claude.</p>
          <p class="deja">Difficulté : séparer tes retouches de celles de Claude ; des moyennes sur des scènes très différentes en disent peu.</p>
        </article>
        <article class="chantier">
          <h3>Masques relus après l'écriture, avec retour en arrière</h3>
          <div class="marques"><span class="pastille moyenne">Moyenne</span><span class="pastille moyen">Risque moyen</span><span class="pastille interet">Intérêt 3/5</span></div>
          <p>Après chaque dégradé ou pinceau, le module relirait ce que Lightroom a gardé et retirerait un masque mal posé. L'avertissement de la 1.5 couvre le cas courant ; la forme complète, à la prochaine grande mise à jour de Lightroom Classic.</p>
          <p class="deja">Il faut d'abord constater la tolérance réelle, pour ne pas retirer de bons masques à cause d'un arrondi.</p>
        </article>
        <article class="chantier">
          <h3>Trier la liste « À constater dans Lightroom »</h3>
          <div class="marques"><span class="pastille petite">Petite</span><span class="pastille faible">Risque faible</span><span class="pastille interet">Intérêt 2/5</span></div>
          <p>Dans <code>docs/SPEC.md</code>, 62 points restent ouverts pour la 1.3, dont plusieurs sans objet. Une liste courte et à jour dirait quoi vérifier à la prochaine recette.</p>
          <p class="deja">Documentation seulement.</p>
        </article>
      </div>
    </section>

    <section class="etape">
      <div class="etape-tete"><h2>Écartées</h2><span class="quand">idées de lightroom-mcp que Développeur n'a pas besoin de reprendre</span></div>
      <div class="ecartees">
        <div class="ecartee"><b>Quasi-doublons par empreinte dHash</b><p>Le tri regroupe déjà les rafales et les piles par l'empreinte de Vision, plus fine qu'un dHash, et nomme la meilleure de chaque groupe.</p></div>
        <div class="ecartee"><b>Plage de couleur copiée d'une autre photo</b><p><code>copy_settings</code> copie déjà les plages de couleur, et Développeur recalcule un prélèvement sur chaque photo. Le seul vrai risque, les prélèvements multiples, est réglé dans la 1.5.</p></div>
        <div class="ecartee"><b>Mode lecture seule</b><p>La pause fait déjà « Claude regarde, ne retouche pas », et tu travailles en mode Appliquer. Une case qui survit au relancement de Lightroom se ferait vite si tu la demandes un jour.</p></div>
      </div>
    </section>
